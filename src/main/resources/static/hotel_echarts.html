<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title></title>
	<!-- Load echarts.js -->
	<script src="https://cdn.staticfile.org/echarts/4.3.0/echarts.min.js"></script>
	<style type="text/css">
		*{
			margin: 0;
			padding: 0;
		}
		.main{
			width: 100%;
			height: 100%;
			position: absolute;
		}
		.quarter-div{
			width: 50%;
			height: 50%;
			float: left;
		}
	</style>
</head>
<body>
<div class="main">
	<h1 align="center">Travel Platform Data Analysis</h1>
	<br />

	<div class="quarter-div" id="hongkong_hotel">
		<script type="text/javascript">
			var chartDom = document.getElementById('hongkong_hotel');
			var myChart = echarts.init(chartDom);
			var option;

			option = {
				title: {
					text: 'Hong Kong Hotel Price Distribution'
				},
				tooltip: {
					trigger: 'axis',
					axisPointer: {
						type: 'shadow'
					}
				},
				legend: {
					data: ['Hotel Price']
				},
				grid: {
					left: '3%',
					right: '4%',
					bottom: '5%',
					containLabel: true
				},
				xAxis: {
					type: 'value',
					boundaryGap: [0, 0.01]
				},
				yAxis: {
					type: 'category',
					data: ['Hong Kong Hotel 1', 'Hong Kong Hotel 2', 'Hong Kong Hotel 3', 'Hong Kong Hotel 4', 'Hong Kong Hotel 5',
						'Hong Kong Hotel 6','Hong Kong Hotel 7','Hong Kong Hotel 8','Hong Kong Hotel 9','Hong Kong Hotel 10','Hong Kong Hotel 11',
						'Average Price']
				},
				series: [
					{
						name: 'Hotel Price',
						type: 'bar',
						data: [1789.0,360.0,2318.0,472.0,528.0,1215.0,509.0,628.0,241.0,1259.0,1403.0,1145]
					}
				]
			};

			option && myChart.setOption(option);
		</script>
	</div>
	<div class="quarter-div" id="aomen_hotel">
		<script type="text/javascript">
			var chartDom = document.getElementById('aomen_hotel');
			var myChart = echarts.init(chartDom);
			var option;

			option = {
				title: {
					text: 'Macau Hotel Price Distribution'
				},
				tooltip: {
					trigger: 'axis',
					axisPointer: {
						type: 'shadow'
					}
				},
				legend: {
					data: ['Hotel Price']
				},
				grid: {
					left: '3%',
					right: '4%',
					bottom: '5%',
					containLabel: true
				},
				xAxis: {
					type: 'value',
					boundaryGap: [0, 0.01]
				},
				yAxis: {
					type: 'category',
					data: ['Macau Hotel 1', 'Macau Hotel 2', 'Macau Hotel 3', 'Macau Hotel 4', 'Macau Hotel 5',
						'Macau Hotel 6','Macau Hotel 7','Macau Hotel 8','Macau Hotel 9','Macau Hotel 10','Macau Hotel 11',
						'Average Price']
				},
				series: [
					{
						name: 'Hotel Price',
						type: 'bar',
						data: [286.0,263.0,540.0,407.0,263.0,419.0,1527.0,428.0,446.0,370.0,561.0,797]
					}
				]
			};

			option && myChart.setOption(option);
		</script>
	</div>
	<div class="quarter-div" id="average">
		<script type="text/javascript">
			var chartDom = document.getElementById('average');
			var myChart = echarts.init(chartDom);
			var option;

			option = {
				title: {
					text: 'Average Hotel Price Comparison',
					left: 'center'
				},
				tooltip: {
					trigger: 'item'
				},
				legend: {
					orient: 'vertical',
					left: 'left',
				},
				series: [
					{
						name: 'Average Price',
						type: 'pie',
						radius: '50%',
						data: [
							{value: 797, name: 'Macau Hotels'},
							{value: 1145, name: 'Hong Kong Hotels'}
						],
						emphasis: {
							itemStyle: {
								shadowBlur: 10,
								shadowOffsetX: 0,
								shadowColor: 'rgba(0, 0, 0, 0.5)'
							}
						}
					}
				]
			};

			option && myChart.setOption(option);
		</script>
	</div>
	<div class="quarter-div" id="hotel_type">
		<script type="text/javascript">
			var chartDom = document.getElementById('hotel_type');
			var myChart = echarts.init(chartDom);
			var option;

			option = {
				title: {
					text: "Hotel Room Type Distribution",
					left: "center",
				},
				tooltip: {
					trigger: 'item'
				},
				legend: {
					top: '10%',
					left: 'center'
				},
				series: [
					{
						name: 'Room Bookings',
						type: 'pie',
						radius: ['33%', '58%'],
						avoidLabelOverlap: false,
						itemStyle: {
							borderRadius: 10,
							borderColor: '#fff',
							borderWidth: 2
						},
						label: {
							show: false,
							position: 'center'
						},
						emphasis: {
							label: {
								show: true,
								fontSize: '40',
								fontWeight: 'bold'
							}
						},
						labelLine: {
							show: false
						},
						data: [
							{value: 957, name: 'Standard Room'},
							{value: 68, name: 'Triple Room'},
							{value: 104, name: 'Deluxe Twin Room'},
							{value: 2, name: 'Superior Queen Room'},
							{value: 24, name: 'Deluxe Twin Balcony Room'},
							{value: 13, name: 'Silka Suite'},
							{value: 55, name: 'Economy Queen Room'},
							{value: 133, name: 'Other'}
						]
					}
				]
			};

			option && myChart.setOption(option);
		</script>
	</div>
</div>
</body>
</html>
